<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write a Story | The Nebula House</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/quill.snow.css">
  <style>
    body { background: #0a0a0a; }

    /* ─── Minimal Top Bar ─── */
    .write-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 2rem; border-bottom: 1px solid rgba(255,255,255,0.06);
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(12px);
    }
    .write-topbar__logo img { height: 32px; }
    .write-topbar__actions { display: flex; align-items: center; gap: 1rem; }
    .write-topbar__publish {
      padding: 0.5rem 1.5rem; background: #4caf50; color: #fff;
      border: none; border-radius: 20px; font-size: 0.9rem;
      font-family: var(--font-secondary); cursor: pointer;
      transition: background 0.2s; font-weight: 600;
    }
    .write-topbar__publish:hover { background: #43a047; }
    .write-topbar__publish:disabled { background: #333; color: #888; cursor: not-allowed; }
    .write-topbar__draft {
      padding: 0.5rem 1rem; background: transparent; color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
      font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    }
    .write-topbar__draft:hover { border-color: #fff; color: #fff; }
    .write-topbar__user {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.1); display: flex; align-items:center;
      justify-content:center; font-size: 0.85rem; font-weight: 700; color:#fff;
    }

    /* ─── Editor Canvas ─── */
    .write-canvas {
      max-width: 740px; margin: 0 auto;
      padding: calc(80px + var(--space-3xl)) 1rem var(--space-4xl);
    }
    .write-title {
      width: 100%; border: none; outline: none; background: transparent;
      font-family: var(--font-primary); font-size: 2.75rem; font-weight: 700;
      color: #fff; line-height: 1.2; padding: 0; margin-bottom: 1rem;
      resize: none; overflow: hidden;
    }
    .write-title::placeholder { color: rgba(255,255,255,0.2); }
    .write-subtitle {
      width: 100%; border: none; outline: none; background: transparent;
      font-family: var(--font-primary); font-size: 1.35rem;
      color: rgba(255,255,255,0.5); line-height: 1.5; padding: 0;
      margin-bottom: 2rem; resize: none; overflow: hidden;
    }
    .write-subtitle::placeholder { color: rgba(255,255,255,0.15); }

    /* Quill overrides for distraction-free look */
    .ql-toolbar.ql-snow {
      border: none !important; border-bottom: 1px solid rgba(255,255,255,0.06) !important;
      padding: 0.5rem 0 !important;
    }
    .ql-toolbar .ql-stroke { stroke: rgba(255,255,255,0.4) !important; }
    .ql-toolbar .ql-fill { fill: rgba(255,255,255,0.4) !important; }
    .ql-toolbar .ql-picker-label { color: rgba(255,255,255,0.4) !important; }
    .ql-toolbar button:hover .ql-stroke { stroke: #fff !important; }
    .ql-toolbar button:hover .ql-fill { fill: #fff !important; }
    .ql-container.ql-snow {
      border: none !important; font-family: var(--font-primary);
      font-size: 1.2rem; color: rgba(255,255,255,0.85);
      min-height: 400px; line-height: 1.8;
    }
    .ql-editor { padding: 1rem 0 !important; }
    .ql-editor::before { color: rgba(255,255,255,0.15) !important; font-style: normal !important; }
    .ql-editor blockquote {
      border-left: 3px solid rgba(255,255,255,0.2) !important;
      color: rgba(255,255,255,0.6) !important;
    }

    /* ─── Publish Modal ─── */
    .publish-overlay {
      position: fixed; inset: 0; z-index: 10001;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center;
    }
    .publish-overlay.open { display: flex; }
    .publish-card {
      background: #111; border: 1px solid #222; border-radius: 12px;
      padding: 2rem; width: 90%; max-width: 500px;
    }
    .publish-card h2 {
      font-family: var(--font-primary); font-size: 1.5rem; margin-bottom: 1.5rem;
    }
    .publish-card label {
      display: block; margin-bottom: 0.5rem; color: var(--text-muted);
      font-size: 0.9rem;
    }
    .publish-card input, .publish-card textarea {
      width: 100%; padding: 0.75rem; background: #1a1a1a;
      border: 1px solid #333; border-radius: 6px; color: #fff;
      font-size: 0.95rem; margin-bottom: 1rem; font-family: inherit;
      outline: none; box-sizing: border-box;
    }
    .publish-card textarea { resize: vertical; min-height: 80px; }
    .publish-card input:focus, .publish-card textarea:focus { border-color: #fff; }
    .publish-actions {
      display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem;
    }
    .publish-actions button {
      padding: 0.65rem 1.5rem; border-radius: 6px; cursor: pointer;
      font-size: 0.95rem; font-family: inherit; border: none;
      transition: all 0.2s;
    }
    .btn-cancel { background: transparent; color: #888; border: 1px solid #333 !important; }
    .btn-cancel:hover { color: #fff; border-color: #fff !important; }
    .btn-go { background: #4caf50; color: #fff; font-weight: 600; }
    .btn-go:hover { background: #43a047; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="write-topbar">
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <a href="the-writers-room.html" class="write-topbar__logo" style="display:flex; align-items:center;">
        <img src="assets/images/room-icon.png" alt="The Nebula House">
      </a>
      <a href="the-writers-room.html" style="color:var(--text-muted); text-decoration:none; font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:0.25rem; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 5 5 12 12 19"></polyline></svg>
        Back
      </a>
    </div>
    <div class="write-topbar__actions">
      <button class="write-topbar__draft" id="btn-ai-assist" style="border-color:#bb86fc; color:#bb86fc;">✨ AI Assistant</button>
      <button class="write-topbar__publish" id="btn-open-publish" disabled>Publish</button>
      <div class="write-topbar__user" id="write-user-avatar"></div>
    </div>
  </div>

  <!-- Editor Canvas -->
  <div class="write-canvas">
    <textarea class="write-title" id="write-title" placeholder="Title" rows="1"></textarea>
    <textarea class="write-subtitle" id="write-subtitle" placeholder="Subtitle (optional)" rows="1"></textarea>
    <div id="quill-editor"></div>
  </div>

  <!-- AI Assistant Modal -->
  <div class="publish-overlay" id="ai-modal">
    <div class="publish-card" style="max-width: 600px;">
      <h2>✨ Nebula AI Assistant</h2>
      <p style="color:#aaa; font-size:0.9rem; margin-bottom:1.5rem;">We'll analyze your story and suggest improvements for tone, style, and flow.</p>
      
      <div id="ai-loading" style="display:none; text-align:center; padding:2rem 0;">
        <div style="font-size:2rem; margin-bottom:1rem;" class="spin">⏳</div>
        <p>Analyzing your story with Gemini AI...</p>
      </div>

      <div id="ai-results" style="display:none;">
        <div style="background:rgba(255,255,255,0.05); padding:1rem; border-radius:8px; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:600; color:#fff;">Readability Score:</span>
          <span id="ai-readability" style="font-size:1.5rem; font-weight:700; color:#bb86fc;">85/100</span>
        </div>

        <div style="margin-bottom:1.5rem;">
          <label>Improvement Suggestions:</label>
          <div id="ai-suggestions-list" style="max-height: 180px; overflow-y: auto; background:#1c1c1c; border-radius:6px; padding:1rem;">
            <!-- suggestions go here -->
          </div>
        </div>

        <div style="margin-bottom:1rem;">
          <label>Preview Optimized Story:</label>
          <div id="ai-preview-text" style="max-height: 150px; overflow-y: auto; background:#1c1c1c; border-radius:6px; padding:1rem; font-size:0.95rem; line-height:1.6; color:#ddd; white-space: pre-wrap;">
          </div>
        </div>
      </div>

      <div class="publish-actions">
        <button class="btn-cancel" id="btn-close-ai">Close</button>
        <button class="btn-go" id="btn-apply-ai" style="background:#bb86fc; display:none; color:#000;">Apply Suggestions</button>
        <button class="btn-go" id="btn-run-ai">Run AI Check</button>
      </div>
    </div>
  </div>

  <!-- Publish Settings Modal -->
  <div class="publish-overlay" id="publish-modal">
    <div class="publish-card">
      <h2>Ready to publish?</h2>
      
      <label>Participate in Monthly Challenge? (optional)</label>
      <select id="publish-challenge" style="width: 100%; padding: 0.75rem; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 0.95rem; margin-bottom: 1.25rem; outline:none; font-family:inherit;">
        <option value="">-- No Challenge (Regular Story) --</option>
      </select>

      <label>Tags (comma separated)</label>
      <input type="text" id="publish-tags" placeholder="Philosophy, Faith, Identity">
      
      <label>Story Preview (excerpt shown in the feed)</label>
      <textarea id="publish-excerpt" placeholder="A short summary of your story..."></textarea>
      
      <div class="publish-actions">
        <button class="btn-cancel" id="btn-cancel-publish">Cancel</button>
        <button class="btn-go" id="btn-confirm-publish">Publish Now</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/quill.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script>
    // Spin animation style injected programmatically
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .spin { display: inline-block; animation: spin 1.5s linear infinite; }
    `;
    document.head.appendChild(style);

    let aiImprovedText = "";

    // ─── Auth Guard & Active Challenges loader ───
    document.addEventListener('DOMContentLoaded', async () => {
      // Small timeout to allow api.js token validation IIFE to resolve
      setTimeout(async () => {
        const user = getCurrentUser();
        if (!user) {
          window.location.href = 'the-writers-room.html';
          return;
        }
        // Show user avatar
        const avatar = document.getElementById('write-user-avatar');
        if (avatar) {
          const initial = (user.name || user.email)[0].toUpperCase();
          avatar.textContent = initial;
        }

        // Fetch active challenges to populate challenge select dropdown
        try {
          const challenges = await nebulaGetChallenges(true);
          const select = document.getElementById('publish-challenge');
          if (challenges && challenges.length > 0) {
            challenges.forEach(c => {
              const opt = document.createElement('option');
              opt.value = c.id;
              opt.textContent = c.title;
              select.appendChild(opt);
            });
          }
        } catch (e) {
          console.error("Error fetching active challenges:", e);
        }
      }, 300);
    });

    // ─── Auto-resize textareas ───
    document.querySelectorAll('.write-title, .write-subtitle').forEach(el => {
      el.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = this.scrollHeight + 'px';
      });
    });

    // ─── Quill Editor ───
    const quill = new Quill('#quill-editor', {
      theme: 'snow',
      placeholder: 'Tell your story...',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'align': [] }],
          ['blockquote', 'code-block'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'image'],
          ['clean']
        ]
      }
    });

    // ─── Edit Story Pre-population ───
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    if (editId) {
      document.getElementById('btn-open-publish').textContent = 'Save Changes';
      document.getElementById('btn-confirm-publish').textContent = 'Save Changes';
      
      // Load post details
      (async () => {
        try {
          const post = await nebulaGetPost(editId);
          document.getElementById('write-title').value = post.title;
          document.getElementById('write-subtitle').value = post.subtitle || '';
          quill.root.innerHTML = post.body || '';
          
          // Trigger resize on textareas
          document.querySelectorAll('.write-title, .write-subtitle').forEach(el => {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
          });
          
          // Pre-populate publish modal fields
          document.getElementById('publish-tags').value = post.tags || '';
          document.getElementById('publish-excerpt').value = post.excerpt || '';
          document.getElementById('publish-challenge').value = post.challengeId || '';
          
          // Enable publish button
          document.getElementById('btn-open-publish').disabled = false;
        } catch (err) {
          alert('Failed to load story for editing: ' + err.message);
        }
      })();
    }

    // Enable publish button when there's content
    quill.on('text-change', () => {
      const hasContent = quill.getText().trim().length > 0;
      const hasTitle = document.getElementById('write-title').value.trim().length > 0;
      document.getElementById('btn-open-publish').disabled = !(hasContent && hasTitle);
    });

    document.getElementById('write-title').addEventListener('input', () => {
      const hasContent = quill.getText().trim().length > 0;
      const hasTitle = document.getElementById('write-title').value.trim().length > 0;
      document.getElementById('btn-open-publish').disabled = !(hasContent && hasTitle);
    });

    // ─── AI ASSISTANT FLOW ───
    document.getElementById('btn-ai-assist').addEventListener('click', () => {
      document.getElementById('ai-modal').classList.add('open');
      document.getElementById('ai-results').style.display = 'none';
      document.getElementById('btn-apply-ai').style.display = 'none';
      document.getElementById('btn-run-ai').style.display = 'block';
    });

    document.getElementById('btn-close-ai').addEventListener('click', () => {
      document.getElementById('ai-modal').classList.remove('open');
    });

    document.getElementById('btn-run-ai').addEventListener('click', async () => {
      const text = quill.getText().trim();
      if (!text) return alert("Please write some content first before analyzing.");

      const runBtn = document.getElementById('btn-run-ai');
      const loader = document.getElementById('ai-loading');
      
      runBtn.disabled = true;
      runBtn.textContent = 'Analyzing...';
      loader.style.display = 'block';
      document.getElementById('ai-results').style.display = 'none';

      try {
        const results = await nebulaAIAssist(text);
        loader.style.display = 'none';
        document.getElementById('ai-results').style.display = 'block';
        
        // Populate readability score
        document.getElementById('ai-readability').textContent = `${results.readabilityScore || 80}/100`;
        
        // Populate suggestions
        const list = document.getElementById('ai-suggestions-list');
        if (results.suggestions && results.suggestions.length > 0) {
          list.innerHTML = results.suggestions.map(s => `
            <div style="margin-bottom:0.8rem; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:0.5rem; line-height: 1.4;">
              <div style="text-decoration:line-through; color:#f87171; font-size:0.85rem;">"${s.original}"</div>
              <div style="color:#4ade80; font-size:0.85rem; font-weight:600; margin:0.15rem 0;">→ "${s.replacement}"</div>
              <div style="color:#9ca3af; font-size:0.8rem; font-style:italic;">Reason: ${s.reason}</div>
            </div>
          `).join('');
        } else {
          list.innerHTML = '<div style="color:#aaa; font-size:0.88rem;">Your writing looks fantastic! No grammar or style recommendations.</div>';
        }

        // Preview text
        aiImprovedText = results.improvedText || text;
        document.getElementById('ai-preview-text').textContent = aiImprovedText;
        
        document.getElementById('btn-apply-ai').style.display = 'block';
        runBtn.style.display = 'none';
      } catch (err) {
        loader.style.display = 'none';
        alert("AI error: " + err.message);
      }

      runBtn.disabled = false;
      runBtn.textContent = 'Run AI Check';
    });

    document.getElementById('btn-apply-ai').addEventListener('click', () => {
      if (aiImprovedText) {
        quill.root.innerHTML = aiImprovedText;
        document.getElementById('ai-modal').classList.remove('open');
        alert("Suggestions successfully applied to editor!");
      }
    });

    // ─── Publish Flow ───
    document.getElementById('btn-open-publish').addEventListener('click', () => {
      const text = quill.getText().trim();
      document.getElementById('publish-excerpt').value = text.substring(0, 200) + (text.length > 200 ? '...' : '');
      document.getElementById('publish-modal').classList.add('open');
    });

    document.getElementById('btn-cancel-publish').addEventListener('click', () => {
      document.getElementById('publish-modal').classList.remove('open');
    });

    document.getElementById('btn-confirm-publish').addEventListener('click', async () => {
      const user = getCurrentUser();
      if (!user) return;

      const btn = document.getElementById('btn-confirm-publish');
      btn.disabled = true;
      btn.textContent = 'Submitting...';

      const post = {
        title: document.getElementById('write-title').value.trim(),
        subtitle: document.getElementById('write-subtitle').value.trim(),
        body: quill.root.innerHTML,
        tags: document.getElementById('publish-tags').value.trim(),
        excerpt: document.getElementById('publish-excerpt').value.trim(),
        challengeId: document.getElementById('publish-challenge').value || null,
      };

      try {
        if (editId) {
          await nebulaUpdatePost(editId, post);
          const isAdminUser = isAdmin(user);
          const successMsg = isAdminUser 
            ? 'Your story has been updated and is instantly live!'
            : 'Your story has been updated and is pending review.';
            
          document.getElementById('publish-modal').innerHTML = `
            <div class="publish-card" style="text-align:center;">
              <div style="font-size:3rem; margin-bottom:1rem;">🎉</div>
              <h2 style="font-family:var(--font-primary);">Story Updated!</h2>
              <p style="color:#aaa; margin: 1rem 0 1.5rem; line-height:1.6;">
                ${successMsg}
              </p>
              <a href="${isAdminUser ? 'my-thoughts.html' : 'the-writers-room.html'}" class="btn-go" style="display:inline-block; padding:0.65rem 2rem; border-radius:6px; text-decoration:none; background:#4caf50; color:#fff; font-weight:600;">View Stories</a>
            </div>
          `;
        } else {
          await nebulaCreatePost(post);
          document.getElementById('publish-modal').innerHTML = `
            <div class="publish-card" style="text-align:center;">
              <div style="font-size:3rem; margin-bottom:1rem;">🎉</div>
              <h2 style="font-family:var(--font-primary);">Story Submitted!</h2>
              <p style="color:#aaa; margin: 1rem 0 1.5rem; line-height:1.6;">
                Your story is pending review. Once approved by our admin, it will appear in The Writer's Room.
              </p>
              <a href="the-writers-room.html" class="btn-go" style="display:inline-block; padding:0.65rem 2rem; border-radius:6px; text-decoration:none; background:#4caf50; color:#fff; font-weight:600;">Back to the Room</a>
            </div>
          `;
        }
      } catch (err) {
        alert("Error publishing post: " + err.message);
        btn.disabled = false;
        btn.textContent = editId ? 'Save Changes' : 'Publish Now';
      }
    });
  </script>
</body>
</html>
